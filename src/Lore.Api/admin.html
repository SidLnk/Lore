<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lore admin</title>
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"%3E %3Cpath fill="%232B4C3F" fill-rule="evenodd" d="M80 32 H176 A48 48 0 0 1 224 80 V176 A48 48 0 0 1 176 224 H80 A48 48 0 0 1 32 176 V80 A48 48 0 0 1 80 32 Z M76 64 H152 L192 104 V180 A12 12 0 0 1 180 192 H104 L64 152 V76 A12 12 0 0 1 76 64 Z"/%3E %3C/svg%3E'>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { margin: .5rem 0 1rem; color: light-dark(#2B4C3F, #6FA88C); }
  h1 svg { display: block; height: 2.5rem; width: auto; }
  h2 { font-size: 1.375rem; margin: 2rem 0 .5rem; }
  .code { font-size: 3rem; font-weight: 700; letter-spacing: .3em; font-variant-numeric: tabular-nums; }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid #8884; }
  button { font: inherit; padding: 8px 14px; }
  .muted { opacity: .7; }
  .status { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 0; }
  .status dt { opacity: .7; }
  .status dd { margin: 0; }
  .warn { color: light-dark(#b3261e, #ffb4ab); font-weight: 600; }
</style>
</head>
<body>
<h1><svg viewBox="8 16 684 216" role="img" aria-label="Lore">
<g id="symbol">
  <path fill="currentColor" fill-rule="evenodd" d="M80 32 H176 A48 48 0 0 1 224 80 V176 A48 48 0 0 1 176 224 H80 A48 48 0 0 1 32 176 V80 A48 48 0 0 1 80 32 Z M82 72 H135 L184 121 V174 A10 10 0 0 1 174 184 H121 L72 135 V82 A10 10 0 0 1 82 72 Z M60 140 L116 196 H66 A6 6 0 0 1 60 190 Z M140 60 H190 A6 6 0 0 1 196 66 V116 Z"/>
  </g>
  <g id="wordmark" transform="translate(280 0)">
  <path fill="currentColor" d="M14 24 A14 14 0 0 1 28 38 V186 A14 14 0 0 1 0 186 V38 A14 14 0 0 1 14 24 Z"/>
  <path fill="currentColor" fill-rule="evenodd" d="M46 140 A60 60 0 1 0 166 140 A60 60 0 1 0 46 140 Z M74 140 A32 32 0 1 0 138 140 A32 32 0 1 0 74 140 Z"/>
  <path fill="currentColor" d="M184 80 H212 V200 H184 Z M184 140 A60 60 0 0 1 244 80 V108 A32 32 0 0 0 212 140 Z"/>
  <path fill="currentColor" d="M370.43 182.43 A60 60 0 1 1 388 140 H360 A32 32 0 1 0 350.63 162.63 Z M288 128 H388 V150 H288 Z"/>
  </g>
</svg></h1>

<section>
  <h2>Pair a phone</h2>
  <p class="muted">Open Lore on the phone, enter the server address, then type this code. Codes expire in 10 minutes and work once.</p>
  <button id="new-code">New pairing code</button>
  <p class="code" id="code" aria-live="polite"></p>
  <p class="muted" id="expires"></p>
</section>

<section>
  <h2>Server</h2>
  <dl id="status" class="status"></dl>
</section>

<section>
  <h2>App update</h2>
  <p class="muted">Phones on home Wi-Fi offer this version under Family → Update Lore. Upload the signed APK from a Lore release.</p>
  <p id="app-current"></p>
  <input type="file" id="app-file" accept=".apk,application/vnd.android.package-archive">
  <button id="app-upload">Upload APK</button>
  <p class="muted" id="app-status" aria-live="polite"></p>
</section>

<section>
  <h2>Devices</h2>
  <table>
    <thead><tr><th>Name</th><th>Paired</th><th>Last seen</th><th></th></tr></thead>
    <tbody id="devices"></tbody>
  </table>
</section>

<script>
const fmt = d => d ? new Date(d).toLocaleString() : '—';

document.getElementById('new-code').onclick = async () => {
  // Absolute paths: relative ones resolved to /api/... when the page was opened as /admin (no trailing slash).
  const r = await fetch('/admin/api/pairing-codes', { method: 'POST' });
  if (!r.ok) { document.getElementById('expires').textContent = `Couldn't create a code (HTTP ${r.status}). Reload the page and try again.`; return; }
  const { code, expiresAt } = await r.json();
  document.getElementById('code').textContent = code;
  document.getElementById('expires').textContent = 'Expires ' + fmt(expiresAt);
};

async function loadDevices() {
  const devices = await (await fetch('/admin/api/devices')).json();
  const body = document.getElementById('devices');
  body.replaceChildren(...devices.map(d => {
    const tr = document.createElement('tr');
    for (const v of [d.name, fmt(d.pairedAt), fmt(d.lastSeenAt)]) {
      const td = document.createElement('td'); td.textContent = v; tr.append(td);
    }
    const td = document.createElement('td');
    if (d.revokedAt) td.textContent = 'Revoked';
    else {
      const b = document.createElement('button');
      b.textContent = 'Revoke';
      b.onclick = async () => { await fetch(`/admin/api/devices/${d.id}/revoke`, { method: 'POST' }); loadDevices(); };
      td.append(b);
    }
    tr.append(td);
    return tr;
  }));
}
loadDevices();

const bytes = n => {
  for (const [u, k] of [['TB', 2 ** 40], ['GB', 2 ** 30], ['MB', 2 ** 20], ['KB', 2 ** 10]])
    if (n >= k) return (n / k).toFixed(1) + ' ' + u;
  return n + ' B';
};

async function loadStatus() {
  const s = await (await fetch('/admin/api/status')).json();
  const rows = [
    ['Photos & videos', `${s.mediaCount.toLocaleString()} (${bytes(s.mediaBytes)})`],
    ['Recycle bin', `${s.binCount.toLocaleString()} item(s)`],
    ['Uploads in progress', `${s.uploadsInProgress} (${bytes(s.partialBytes)} received)`],
    ['Disk', `${bytes(s.volumeFreeBytes)} free of ${bytes(s.volumeTotalBytes)}`, s.volumeFreeBytes < s.volumeTotalBytes * 0.05],
    ['Last DB snapshot', s.lastSnapshotAt ? fmt(s.lastSnapshotAt) : 'Not yet', !s.lastSnapshotAt],
    ['Video tools (ffmpeg)', s.ffmpegAvailable ? 'Available' : 'Missing: videos get no thumbnails or dates', !s.ffmpegAvailable],
  ];
  document.getElementById('status').replaceChildren(...rows.flatMap(([k, v, warn]) => {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v; if (warn) dd.className = 'warn';
    return [dt, dd];
  }));
}
loadStatus();

async function loadApp() {
  const r = await fetch('/admin/api/app');
  document.getElementById('app-current').textContent = r.ok
    ? (v => `Offering version ${v.versionName} (${bytes(v.size)}), uploaded ${fmt(v.uploadedAt)}.`)(await r.json())
    : 'No app version uploaded yet.';
}
document.getElementById('app-upload').onclick = async () => {
  const file = document.getElementById('app-file').files[0];
  const status = document.getElementById('app-status');
  if (!file) { status.textContent = 'Choose the APK file first.'; return; }
  status.textContent = `Uploading ${file.name}…`;
  const r = await fetch('/admin/api/app', { method: 'POST', body: file });
  status.textContent = r.ok ? 'Done. Phones will see the update next time they open Lore on home Wi-Fi.' : (await r.text()).replace(/^"|"$/g, '');
  if (r.ok) loadApp();
};
loadApp();
</script>
</body>
</html>
